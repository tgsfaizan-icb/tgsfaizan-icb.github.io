<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Car Bazar | Premium Pre-Owned Cars</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .hero {
      min-height: 70vh;
      display: flex;
      align-items: center;
      padding: 60px 6%;
      background: linear-gradient(135deg, #111, #333);
      color: white;
    }

    .hero-content {
      max-width: 700px;
    }

    .hero h1 {
      font-size: 48px;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      color: #ddd;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 25px;
      background: #fff;
      color: #111;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin-right: 10px;
    }

    .btn-dark {
      background: transparent;
      border: 1px solid white;
      color: white;
    }

    .section {
      padding: 60px 6%;
    }

    .section h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 35px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: -50px;
      position: relative;
    }

    .stat {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .stat h3 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .cars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    . car
